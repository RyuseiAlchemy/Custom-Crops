name: Build Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew shadowJar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/libs/*.jar
